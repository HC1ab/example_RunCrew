name: CI/CD

# Changes → Lint → Test(Matrix, 재사용 워크플로우) → Build(아티팩트 업로드) → Deploy(아티팩트 다운로드) → Notify
# - 변경 파일을 감지해 필요한 단계만 실행한다 (문서만 바뀌면 Lint/Test/Build/Deploy 생략)
# - PR: Lint, Test, Build까지만 실행 (배포 없음)
# - main push: 코드나 대시보드가 바뀌었을 때만 배포. deploy-pages가 github-pages 환경에
#   Deployment 기록을 남기고, DORA Metrics 워크플로우가 이 기록으로 지표를 계산한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"
  pull_request:
  workflow_dispatch:
    inputs:
      cache:
        description: npm 캐시 사용 (캐싱 효과 측정 시 끔)
        type: boolean
        default: true

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소한다 (main 배포는 순서대로 끝까지 실행)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # push/PR에서는 inputs가 비어 있으므로 기본값 true
  USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 수동 실행은 항상 전체 파이프라인을 돌린다
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - "scripts/**"
              - "test/**"
              - "package.json"
              - "package-lock.json"
              - "eslint.config.js"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-node-test.yml"
              - ".github/actions/**"
            site:
              - "dashboard/**"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
        with:
          cache: ${{ env.USE_CACHE }}
      - run: npm run lint

  test:
    name: Test
    needs: lint
    uses: ./.github/workflows/reusable-node-test.yml
    with:
      cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}

  build:
    name: Build
    needs: [changes, test]
    # 코드가 안 바뀌어 Test가 skipped여도, 대시보드가 바뀌었으면 빌드한다
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
        with:
          cache: ${{ env.USE_CACHE }}

      # 커버리지가 line/branch/function 80% 미만이면 실패 (package.json의 test:coverage 기준)
      - name: Coverage report
        run: npm run test:coverage -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=lcov.info

      - name: Assemble site
        run: |
          mkdir -p _site/metrics
          cp -r dashboard/. _site/
          cp metrics/*.json _site/metrics/
          cat > _site/build-info.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    # main push(또는 main 수동 실행)이고 빌드가 성공했을 때만 배포
    if: >-
      always() && needs.build.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Notify
    needs: [lint, test, build, deploy]
    # main에서 어느 단계가 실패했거나, 배포가 실제로 일어났을 때만 알린다
    # (문서만 바뀌어 전부 skipped인 경우는 알리지 않음)
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          # Secret은 환경 변수로만 넘기고 명령어나 로그에 직접 쓰지 않는다
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} deploy=${{ needs.deploy.result }}"
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            MESSAGE="❌ RunCrew 파이프라인 실패 (\`${SHA:0:7}\`) ${RESULTS} ${RUN_URL}"
          else
            MESSAGE="✅ RunCrew 배포 성공 (\`${SHA:0:7}\`) ${RUN_URL}"
          fi
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" > /dev/null
          echo "Notification sent"

  # 브랜치 보호 규칙의 필수 체크로 쓰는 단일 결과 job.
  # 변경 감지로 일부 job이 skipped여도 실패한 job이 없으면 통과한다.
  result:
    name: CI Result
    needs: [changes, lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::CI failed"; exit 1 ;;
          esac
