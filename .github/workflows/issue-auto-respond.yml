name: Issue Auto Respond

# 새 이슈에 안내 댓글을 달고 `status: triage` 라벨을 붙인다.
# 비동기 협업에서 "내 이슈를 누가 봤는지" 알 수 없는 불안을 줄이고, 첫 응답 SLA를 알린다.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  respond:
    # 봇이 만든 이슈와 자동 보고서(report)는 제외
    if: github.event.issue.user.type != 'Bot' && !contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - name: Label and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # 관리자가 직접 만든 이슈는 이미 분류된 작업이므로 triage 라벨을 붙이지 않는다
          ASSOCIATION: ${{ github.event.issue.author_association }}
          IS_INCIDENT: ${{ contains(github.event.issue.labels.*.name, 'incident') }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) IS_MAINTAINER=true ;;
            *) IS_MAINTAINER=false ;;
          esac

          if [ "$IS_MAINTAINER" = "false" ]; then
            gh issue edit "$NUMBER" -R "$REPO" --add-label "status: triage"
          fi

          {
            echo "@${AUTHOR} 이슈를 남겨 주셔서 감사합니다! 🏃"
            echo
            if [ "$IS_INCIDENT" = "true" ]; then
              echo "🚨 **incident**로 등록되었습니다. 이 이슈가 열린 시점부터 닫힐 때까지의 시간이 DORA **MTTR**로 집계됩니다."
              echo "복구가 끝나면 원인과 조치 내용을 남기고 이슈를 닫아 주세요."
            elif [ "$IS_MAINTAINER" = "false" ]; then
              echo "- 관리자가 **48시간 안에** 첫 응답을 드립니다. 48시간이 지나면 \`status: sla-breached\` 라벨이 자동으로 붙습니다."
              echo "- 재현 방법, 기대 동작, 환경 정보가 있으면 더 빨리 확인할 수 있어요."
            else
              echo "- 작업을 시작하면 칸반 보드에서 상태를 **In Progress**로 옮겨 주세요."
              echo "- 브랜치 이름과 커밋 규칙은 기여 가이드를 따라 주세요."
            fi
            echo
            echo "📚 [기여 가이드](https://github.com/${REPO}/blob/main/CONTRIBUTING.md) · [리뷰 가이드](https://github.com/${REPO}/blob/main/docs/REVIEW_GUIDE.md)"
          } > comment.md

          gh issue comment "$NUMBER" -R "$REPO" --body-file comment.md
