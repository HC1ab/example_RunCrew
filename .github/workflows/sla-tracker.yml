name: SLA Tracker

# 응답 시간 약속(SLA)을 지키지 못한 이슈와 PR에 `status: sla-breached` 라벨을 붙이고 한 번 알린다.
# - 이슈: 외부 기여자가 연 이슈에 관리자 응답이 48시간 동안 없을 때
# - PR: 리뷰가 24시간 동안 하나도 없을 때 (draft 제외)
# 응답이나 리뷰가 생기면 라벨을 자동으로 뗀다.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: sla-tracker
  cancel-in-progress: false

env:
  ISSUE_SLA_HOURS: 48
  PR_REVIEW_SLA_HOURS: 24
  LABEL: "status: sla-breached"

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          breached=0; recovered=0

          # 외부 기여자가 연 열린 이슈만 대상 (관리자 이슈, PR, 자동 보고서 제외)
          gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null)
                      | select(.author_association | IN("OWNER","MEMBER","COLLABORATOR") | not)
                      | select([.labels[].name] | index("report") | not)
                      | [.number, .created_at, ([.labels[].name] | index(env.LABEL) != null)] | @tsv' |
          while IFS=$'\t' read -r number created has_label; do
            # 관리자가 남긴 댓글이 있으면 응답한 것으로 본다 (봇 댓글 제외)
            responded=$(gh api "repos/$REPO/issues/$number/comments?per_page=100" \
              --jq '[.[] | select(.user.type != "Bot") | select(.author_association | IN("OWNER","MEMBER","COLLABORATOR"))] | length')
            age_h=$(( (now - $(date -u -d "$created" +%s)) / 3600 ))

            if [ "$responded" -gt 0 ] && [ "$has_label" = "true" ]; then
              gh issue edit "$number" -R "$REPO" --remove-label "$LABEL"
              echo "#$number responded → label removed"
            elif [ "$responded" -eq 0 ] && [ "$age_h" -ge "$ISSUE_SLA_HOURS" ] && [ "$has_label" = "false" ]; then
              gh issue edit "$number" -R "$REPO" --add-label "$LABEL"
              gh issue comment "$number" -R "$REPO" --body "⏰ 첫 응답 SLA(${ISSUE_SLA_HOURS}시간)를 넘겼습니다 (경과 ${age_h}시간). 관리자 확인이 필요합니다."
              echo "#$number breached (${age_h}h)"
            fi
          done

      - name: Check pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)

          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft | not)
                      | [.number, .created_at, ([.labels[].name] | index(env.LABEL) != null)] | @tsv' |
          while IFS=$'\t' read -r number created has_label; do
            reviews=$(gh api "repos/$REPO/pulls/$number/reviews?per_page=100" --jq 'length')
            age_h=$(( (now - $(date -u -d "$created" +%s)) / 3600 ))

            if [ "$reviews" -gt 0 ] && [ "$has_label" = "true" ]; then
              gh pr edit "$number" -R "$REPO" --remove-label "$LABEL"
              echo "PR #$number reviewed → label removed"
            elif [ "$reviews" -eq 0 ] && [ "$age_h" -ge "$PR_REVIEW_SLA_HOURS" ] && [ "$has_label" = "false" ]; then
              gh pr edit "$number" -R "$REPO" --add-label "$LABEL"
              gh pr comment "$number" -R "$REPO" --body "⏰ 리뷰 SLA(${PR_REVIEW_SLA_HOURS}시간)를 넘겼습니다 (경과 ${age_h}시간). 리뷰를 부탁드립니다."
              echo "PR #$number breached (${age_h}h)"
            fi
          done

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/issues?state=open&labels=$(printf %s "$LABEL" | jq -sRr @uri)&per_page=100" --jq 'length')
          echo "## ⏰ SLA 현황" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 이슈 첫 응답 SLA: ${ISSUE_SLA_HOURS}시간 / PR 리뷰 SLA: ${PR_REVIEW_SLA_HOURS}시간" >> "$GITHUB_STEP_SUMMARY"
          echo "- 현재 SLA 초과: **${count}건**" >> "$GITHUB_STEP_SUMMARY"
