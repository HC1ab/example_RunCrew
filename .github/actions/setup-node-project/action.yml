name: Setup Node project
description: Node.js 설치, 의존성 캐시 복원, 의존성 설치(npm ci)를 한 번에 처리한다

inputs:
  node-version:
    description: 설치할 Node.js 버전 (예 22, 24, current)
    required: false
    default: "22"
  cache:
    description: |
      의존성 캐시 전략
      - node_modules: node_modules를 통째로 캐시하고, 캐시가 맞으면 npm ci를 건너뛴다 (기본)
      - npm: setup-node 내장 캐시로 ~/.npm 다운로드 캐시만 복원하고 npm ci는 항상 실행
      - none: 캐시 없음 (측정 기준선)
    required: false
    default: node_modules

outputs:
  cache-hit:
    description: 캐시를 복원했는지 여부
    value: ${{ steps.modules-cache.outputs.cache-hit || steps.setup.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: setup
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'npm' && 'npm' || '' }}

    # node_modules는 OS와 Node 버전에 따라 달라질 수 있어 키에 함께 넣는다
    - id: modules-cache
      if: inputs.cache == 'node_modules'
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
